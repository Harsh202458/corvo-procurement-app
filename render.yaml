services:
  - type: web
    name: corvo-pr-to-po
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: corvo-db, property: connectionString }
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false   # set in the Render dashboard, never in git

databases:
  - name: corvo-db
    plan: free
